<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数独</title>
    <link rel="stylesheet" href="../Shared/shared.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">🧩 数独</div>
        <div class="stats">
            <div class="stat"><span class="stat-label">用时</span><span id="timer" class="stat-value">0:00</span></div>
            <div class="stat"><span class="stat-label">错误</span><span id="errors" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">进度</span><span id="progressText" class="stat-value">0/81</span></div>
            <div class="stat"><span class="stat-label">得分</span><span id="score" class="stat-value">0</span></div>
        </div>
        <div class="actions">
            <button id="btnRestart" class="btn">🔄 新一局</button>
        </div>
    </header>

    <div class="progress-wrap"><div id="progress" class="progress"></div></div>

    <!-- 盘面 -->
    <div id="boardContainer" class="board-container">
        <table id="sudokuBoard" class="sudoku-board"></table>
    </div>

    <!-- 数字按钮 -->
    <div id="numPad" class="num-pad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="num-btn erase-btn" data-num="0">✕</button>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button id="btnToggleNote" class="ctrl-btn">✏️ 笔记</button>
        <button id="btnHint" class="ctrl-btn">💡 提示</button>
        <button id="btnCheck" class="ctrl-btn">✅ 检查</button>
    </div>

    <footer class="hint" id="hint">点击格子选中，用数字按钮或键盘填入数字 1-9</footer>

    <div id="toast" class="toast"></div>

    <div id="resultOverlay" class="overlay hidden">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <h2 id="resultTitle">完成！</h2>
            <div class="stars" id="resultStars"></div>
            <div class="result-details">
                <div class="result-row"><span class="result-label">得分</span><b id="resultScore">0</b></div>
                <div class="result-row"><span class="result-label">用时</span><b id="resultTime">0:00</b></div>
                <div class="result-row"><span class="result-label">错误次数</span><b id="resultErrors">0</b></div>
                <div class="result-row"><span class="result-label">提示次数</span><b id="resultHints">0</b></div>
            </div>
            <div class="result-btns">
                <button id="btnAgain" class="btn primary">🎮 再来一局</button>
                <button id="btnClose" class="btn">✕ 关闭</button>
            </div>
        </div>
    </div>

    <script src="../Shared/shared.js"></script>
    <script src="sudoku-engine.js"></script>
    <script src="game.js"></script>
</body>
</html>
