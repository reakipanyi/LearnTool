<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记忆翻牌</title>
    <link rel="stylesheet" href="../Shared/shared.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">🧠 记忆翻牌</div>
        <div class="stats">
            <div class="stat"><span class="stat-label">得分</span><span id="score" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">总分</span><span id="totalScore" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">连击</span><span id="combo" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">步数</span><span id="moves" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">总剩余</span><span id="totalRemaining" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">计时</span><span id="timer" class="stat-value">0s</span></div>
        </div>
        <div class="actions">
            <div class="radio-group" id="skipKnownGroup">
                <label><input type="radio" name="skipKnown" value="skip" checked />跳过已知项</label>
                <label><input type="radio" name="skipKnown" value="all" />加载所有</label>
            </div>
            <button id="btnRestart" class="btn">🔄 换一组</button>
        </div>
    </header>

    <div class="progress-wrap"><div id="progress" class="progress"></div></div>

    <div id="board" class="board"></div>

    <footer class="hint" id="hint">点击翻开卡片，找到单词对应的释义（翻到两张错误会自动翻回）</footer>

    <div id="toast" class="toast"></div>

    <!-- 结算弹层 -->
    <div id="resultOverlay" class="overlay hidden">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <h2 id="resultTitle">通关啦！</h2>
            <div class="stars" id="resultStars">★★★</div>
            <div class="result-details">
                <div class="result-row"><span class="result-label">得分</span><b id="resultScore">0</b></div>
                <div class="result-row"><span class="result-label">步数</span><b id="resultMoves">0</b></div>
                <div class="result-row"><span class="result-label">最优步数</span><b id="resultOptimal">0</b></div>
                <div class="result-row"><span class="result-label">用时</span><b id="resultTime">0s</b></div>
            </div>
            <div class="result-btns">
                <button id="btnAgain" class="btn primary">🎮 再来一局</button>
                <button id="btnClose" class="btn">✕ 关闭</button>
            </div>
        </div>
    </div>

    <script src="../Shared/shared.js"></script>
    <script src="game.js"></script>
</body>
</html>
