<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作记忆训练营</title>
    <link rel="stylesheet" href="../Shared/shared.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="topbar">
        <div class="brand">🧠 工作记忆训练营</div>
        <div class="stats">
            <div class="stat"><span class="stat-label">得分</span><span class="stat-value" id="score">0</span></div>
            <div class="stat"><span class="stat-label">正确</span><span class="stat-value" id="correct">0</span></div>
            <div class="stat"><span class="stat-label">回合</span><span class="stat-value" id="round">0/0</span></div>
            <div class="stat"><span class="stat-label">用时</span><span class="stat-value" id="timer">0s</span></div>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress" style="width:0%"></div>
    </div>

    <div class="game-stage">
        <div class="game-title" id="modeHint">加载中...</div>

        <!-- 通用提示 -->
        <div class="hint" id="hint"></div>

        <!-- N-Back 刺激区域 -->
        <div id="nbackArea" class="memory-area hidden">
            <div id="nbackStimulus" class="nback-stimulus">—</div>
            <div id="nbackHistory" class="nback-history"></div>
            <div class="key-hint"><span class="key">空格</span> 匹配 &nbsp;|&nbsp; <span class="key">R</span> 重新开始</div>
        </div>

        <!-- 数字倒背区域 -->
        <div id="digitSpanArea" class="memory-area hidden">
            <div id="digitDisplay" class="digit-display">—</div>
            <div id="digitInput" class="digit-input"></div>
            <div class="digit-numpad" id="numpad"></div>
            <div class="key-hint">点击数字按钮反向输入 &nbsp;|&nbsp; <span class="key">R</span> 重新开始</div>
        </div>

        <!-- 空间矩阵区域 -->
        <div id="spatialArea" class="memory-area hidden">
            <div class="spatial-grid" id="spatialGrid"></div>
            <div class="key-hint">记住亮起的位置，消失后点击还原 &nbsp;|&nbsp; <span class="key">R</span> 重新开始</div>
        </div>

        <!-- 序列操作区域 -->
        <div id="sequenceArea" class="memory-area hidden">
            <div id="seqDisplay" class="seq-display">—</div>
            <div id="seqActions" class="seq-actions"></div>
            <div id="seqProgress" class="seq-progress"></div>
            <div class="key-hint">记住动作顺序，按顺序点击还原 &nbsp;|&nbsp; <span class="key">R</span> 重新开始</div>
        </div>
    </div>

    <div class="overlay hidden" id="resultOverlay">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <div class="result-title" id="resultTitle">完成！</div>
            <div class="stars" id="resultStars"><span class="lit">★</span><span class="lit">★</span><span class="lit">★</span></div>
            <div class="result-details">
                <div class="result-row"><span class="result-label">得分</span><span class="result-value" id="resultScore">0</span></div>
                <div class="result-row"><span class="result-label">正确率</span><span class="result-value" id="resultRate">0%</span></div>
                <div class="result-row"><span class="result-label">正确/总题</span><span class="result-value" id="resultRight">0/0</span></div>
                <div class="result-row"><span class="result-label">最佳成绩</span><span class="result-value" id="resultBest">—</span></div>
                <div class="result-row"><span class="result-label">用时</span><span class="result-value" id="resultTime">0s</span></div>
                <div class="result-row"><span class="result-label">模式</span><span class="result-value" id="resultMode">—</span></div>
            </div>
            <div class="result-btns">
                <button class="btn primary" onclick="window.GameUI.sendToHost({type:'restart'})">🔄 再来一局</button>
                <button class="btn" onclick="window.GameUI.sendToHost({type:'close'})">关闭</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../Shared/shared.js"></script>
    <script src="game.js"></script>
</body>
</html>
