<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计划预判训练营</title>
    <link rel="stylesheet" href="../Shared/shared.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="topbar">
        <div class="brand">🧩 计划预判</div>
        <div class="stats">
            <div class="stat"><span class="stat-label">得分</span><span class="stat-value" id="score">0</span></div>
            <div class="stat"><span class="stat-label">正确</span><span class="stat-value" id="correct">0</span></div>
            <div class="stat"><span class="stat-label">轮次</span><span class="stat-value" id="round">0</span></div>
            <div class="stat"><span class="stat-label">用时</span><span class="stat-value" id="timer">0s</span></div>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress" style="width:0%"></div>
    </div>

    <div class="game-stage">
        <div class="game-title" id="modeHint">加载中...</div>
        <div class="hint" id="hint">准备开始</div>

        <!-- 路径规划模式 -->
        <div id="pathplanArea" class="mode-area hidden">
            <div class="pp-info">
                <span class="pp-steps" id="ppSteps">步数：0</span>
                <button class="pp-btn" id="ppBtnClear">清除路径</button>
                <button class="pp-btn primary" id="ppBtnConfirm">确认路径</button>
            </div>
            <div class="canvas-wrap">
                <canvas id="ppCanvas"></canvas>
            </div>
            <div class="pp-instruction" id="ppInstruction">从🟢起点点击到🔴终点，避开⬛障碍</div>
        </div>

        <!-- 汉诺塔模式 -->
        <div id="hanoiArea" class="mode-area hidden">
            <div class="hn-info">
                <span class="hn-moves" id="hnMoves">移动次数：0</span>
                <span class="hn-min" id="hnMin">最少：0</span>
                <span class="hn-status" id="hnStatus">将所有盘子从A移到C</span>
            </div>
            <div class="canvas-wrap">
                <canvas id="hnCanvas"></canvas>
            </div>
            <div class="hn-instruction" id="hnInstruction">点击柱子选择顶部盘子，再点击目标柱子移动</div>
        </div>

        <!-- 时间估计模式 -->
        <div id="timeestArea" class="mode-area hidden">
            <div class="te-container">
                <div class="te-visual" id="teVisual">
                    <div class="te-circle" id="teCircle"></div>
                </div>
                <div class="te-info">
                    <div class="te-target" id="teTarget">目标：5 秒</div>
                    <div class="te-result" id="teResult">—</div>
                </div>
                <div class="te-controls">
                    <button class="te-btn primary" id="teBtnStart">开始估计</button>
                </div>
            </div>
            <div class="te-feedback" id="teFeedback">准确估计经过的时间</div>
        </div>
    </div>

    <div class="overlay hidden" id="resultOverlay">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <div class="result-title" id="resultTitle">完成！</div>
            <div class="stars" id="resultStars"><span class="lit">★</span><span class="lit">★</span><span class="lit">★</span></div>
            <div class="result-details">
                <div class="result-row"><span class="result-label">得分</span><span class="result-value" id="resultScore">0</span></div>
                <div class="result-row"><span class="result-label">正确率</span><span class="result-value" id="resultRate">0%</span></div>
                <div class="result-row"><span class="result-label">正确/总题</span><span class="result-value" id="resultRight">0/0</span></div>
                <div class="result-row"><span class="result-label">用时</span><span class="result-value" id="resultTime">0s</span></div>
                <div class="result-row"><span class="result-label">模式</span><span class="result-value" id="resultMode">—</span></div>
            </div>
            <div class="result-btns">
                <button class="btn primary" onclick="window.GameUI.sendToHost({type:'restart'})">🔄 再来一局</button>
                <button class="btn" onclick="window.GameUI.sendToHost({type:'close'})">关闭</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../Shared/shared.js"></script>
    <script src="game.js"></script>
</body>
</html>
