<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打地鼠</title>
    <link rel="stylesheet" href="../Shared/shared.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">🔨 打地鼠</div>
        <div class="stats">
            <div class="stat"><span class="stat-label">得分</span><span id="score" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">连击</span><span id="combo" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">正确</span><span id="right" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">失误</span><span id="misses" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">时间</span><span id="time" class="stat-value">60</span></div>
        </div>
        <div class="actions">
            <button id="btnRestart" class="btn">🔄 换一组</button>
        </div>
    </header>

    <!-- 目标卡 -->
    <div class="target-bar">
        <span class="target-label">找到配对：</span>
        <div class="target-card" id="targetCard">
            <span id="targetText">—</span>
            <button id="btnSpeak" class="btn">🔊</button>
        </div>
    </div>

    <!-- 地鼠洞盘面 -->
    <div id="holes" class="holes"></div>

    <footer class="hint" id="hint">点中与上方配对的那张单词卡，点错/漏点都算失误</footer>

    <div id="toast" class="toast"></div>

    <!-- 结算弹层 -->
    <div id="resultOverlay" class="overlay hidden">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <h2 id="resultTitle">时间到！</h2>
            <div class="stars" id="resultStars">★★★</div>
            <div class="result-details">
                <div class="result-row"><span class="result-label">得分</span><b id="resultScore">0</b></div>
                <div class="result-row"><span class="result-label">正确</span><b id="resultRight">0</b></div>
                <div class="result-row"><span class="result-label">失误</span><b id="resultMisses">0</b></div>
                <div class="result-row"><span class="result-label">最高连击</span><b id="resultCombo">0</b></div>
            </div>
            <div class="result-btns">
                <button id="btnAgain" class="btn primary">🎮 再来一局</button>
                <button id="btnClose" class="btn">✕ 关闭</button>
            </div>
        </div>
    </div>

    <script src="../Shared/shared.js"></script>
    <script src="game.js"></script>
</body>
</html>
